name: RTG sandbox checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      RTG_MODE: sandbox
      RTG_SESSION_SECRET: rtg-ci-fictional-data-only-session-secret
      RTG_SANDBOX_WEBHOOK_SECRET: rtg-ci-fixture-webhook-secret
      # Schema validation does not connect to this placeholder database.
      DATABASE_URL: postgresql://rtg:rtg@127.0.0.1:5432/rtg_design
    steps:
      - name: Configure sandbox data directory
        run: echo "RTG_DATA_DIR=$RUNNER_TEMP/rtg-sandbox" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run Vitest
        run: npm test
      - name: Validate PostgreSQL design
        run: npm run schema:validate
      - name: Build Next.js
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright end-to-end checks
        run: npm run test:e2e -- --project=chromium
